<div class="min-h-5 flex flex-col bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-gray-800">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <!-- Logo and Navigation Links -->
          <div class="flex items-center">
            <div class="shrink-0">
              <img
                alt="Your Company"
                [src]="'/' + imglogo"
                class="size-12"
              />
            </div>
            <div class="hidden md:block">
              <div class="ml-10 flex items-baseline space-x-4">
                <a
                  *ngFor="let item of navigation"
                  [routerLink]="item.href"
                  [ngClass]="{
                    'bg-gray-900 text-white': item.current,
                    'text-gray-300 hover:bg-gray-700 hover:text-white': !item.current
                  }"
                  class="rounded-md px-3 py-2 text-sm font-medium"
                >
                  {{ item.name }}
                </a>
              </div>
            </div>
          </div>
  
          <!-- Profile Dropdown and Notifications -->
          <div class="hidden md:block">
            <div class="ml-4 flex items-center md:ml-6">
              <button
                type="button"
                class="relative rounded-full bg-gray-800 p-1 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
              >
                <span class="absolute -inset-1.5"></span>
                <span class="sr-only">View notifications</span>
                <!-- Replace with Angular Material Icon -->
                <mat-icon>notifications</mat-icon>
              </button>
  
              <!-- Profile Dropdown -->
              <div class="relative ml-3">
                <button
                  (click)="toggleMenu()"
                  class="relative flex max-w-xs items-center rounded-full bg-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
                >
                  <span class="absolute -inset-1.5"></span>
                  <span class="sr-only">Open user menu</span>
                  <img class="size-8 rounded-full" [src]="user.imageUrl" alt="" />
                </button>
  
                <!-- Dropdown Menu -->
                <div
                  *ngIf="isMenuOpen"
                  class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
                >
                  <a
                    *ngFor="let item of userNavigation"
                    [routerLink]="item.href"
                    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
                  >
                    {{ item.name }}
                  </a>
                </div>
              </div>
            </div>
          </div>
  
          <!-- Mobile Menu Button -->
          <div class="-mr-2 flex md:hidden">
            <button
              (click)="toggleMenu()"
              type="button"
              class="relative inline-flex items-center justify-center rounded-md bg-gray-800 p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
            >
              <span class="absolute -inset-0.5"></span>
              <span class="sr-only">Open main menu</span>
              <!-- Replace with Angular Material Icon -->
              <mat-icon *ngIf="!isMenuOpen">menu</mat-icon>
              <mat-icon *ngIf="isMenuOpen">close</mat-icon>
            </button>
          </div>
        </div>
      </div>
  
      <!-- Mobile Menu -->
      <div *ngIf="isMenuOpen" class="md:hidden">
        <div class="space-y-1 px-2 pt-2 pb-3 sm:px-3">
          <a
            *ngFor="let item of navigation"
            [routerLink]="item.href"
            [ngClass]="{
              'bg-gray-900 text-white': item.current,
              'text-gray-300 hover:bg-gray-700 hover:text-white': !item.current
            }"
            class="block rounded-md px-3 py-2 text-base font-medium"
          >
            {{ item.name }}
          </a>
        </div>
        <div class="border-t border-gray-700 pt-4 pb-3">
          <div class="flex items-center px-5">
            <div class="shrink-0">
              <img class="size-10 rounded-full" [src]="user.imageUrl" alt="" />
            </div>
            <div class="ml-3">
              <div class="text-base font-medium text-white">{{ user.name }}</div>
              <div class="text-sm font-medium text-gray-400">{{ user.email }}</div>
            </div>
            <button
              type="button"
              class="relative ml-auto shrink-0 rounded-full bg-gray-800 p-1 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
            >
              <span class="absolute -inset-1.5"></span>
              <span class="sr-only">View notifications</span>
              <!-- Replace with Angular Material Icon -->
              <mat-icon>notifications</mat-icon>
            </button>
          </div>
          <div class="mt-3 space-y-1 px-2">
            <a
              *ngFor="let item of userNavigation"
              [routerLink]="item.href"
              class="block rounded-md px-3 py-2 text-base font-medium text-gray-400 hover:bg-gray-700 hover:text-white"
            >
              {{ item.name }}
            </a>
          </div>
        </div>
      </div>
    </nav>
  

  </div>
